name: MLOps-CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: python data/download.py

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Train model
        run: python src/train.py

      - name: Build Docker image
        run: docker build -t heart-disease-api:0.1.0.

      - name: Test Docker API
        run: |
          docker run -d -p 8000:8000 --name test-api heart-disease-api:0.1.0
          sleep 10
          curl -f http://localhost:8000/ || exit 1
          docker stop test-api
