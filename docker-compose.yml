version: '3.8'
services:
  api:
    build: .
    ports:
            - "8000:8000"
    volumes:
            - ./models:/app/models
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  prometheus:
    image: prom/prometheus
    ports:
            - "9090:9090"
    volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
            - "3000:3000"
    environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin